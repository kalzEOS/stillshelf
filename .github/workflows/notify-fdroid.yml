name: Notify F-Droid repository
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable StillShelf release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-24.04
    steps:
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets)
          jq -e --arg asset "StillShelf-$TAG-fdroid.zip" '(.isDraft == false) and (.isPrerelease == false) and any(.assets[]; .name == $asset)' <<< "$release" >/dev/null
      - name: Trigger F-Droid publication
        env:
          GH_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::FDROID_DISPATCH_TOKEN is not configured"
            exit 1
          fi
          gh workflow run publish.yml --repo kalzEOS/stillshelf-fdroid --ref main -f release_tag="$TAG"
          echo "Requested F-Droid publication for $TAG"
